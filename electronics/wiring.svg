<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1760" viewBox="0 0 1800 1760">
<defs><style>
text{font-family:Arial,sans-serif;fill:#193047}.title{font-size:34px;font-weight:bold}.h{font-size:27px;font-weight:bold}.t{font-size:23px}.s{font-size:21px}.box{fill:white;stroke:#c2cedb;stroke-width:2}.pwr{fill:none;stroke:#d23d42;stroke-width:5}.gnd{fill:none;stroke:#34495e;stroke-width:5}.sig{fill:none;stroke:#247ab9;stroke-width:4}.pending{fill:none;stroke:#bf7b14;stroke-width:5;stroke-dasharray:12 8}
</style></defs>
<rect width="1800" height="1760" fill="#f1f5f9"/>
<text x="50" y="60" class="title">SOCCER ROBOT / UPDATED BENCH WIRING</text>
<text x="50" y="100" class="t">9 November 2026 | Battery measured 11.4 V | UNO powered by USB | Connect by printed pin labels.</text>
<rect x="50" y="125" width="1700" height="105" rx="12" fill="#fff0cc"/>
<text x="75" y="165" class="h">Motor supply is NOT finalized: confirm motor voltage before connecting the LiPo to the L298N.</text>
<text x="75" y="205" class="t">Battery is consistent with 3S LiPo: allow for 12.6 V fully charged. Never feed it directly to servo or UNO 5V.</text>

<text x="50" y="280" class="h">1 / POWER: BATTERY → HW-140 → GATE SERVO</text>
<rect x="50" y="310" width="350" height="210" rx="12" class="box"/>
<text x="75" y="352" class="h">LiPo BATTERY</text>
<text x="75" y="390" class="t">Measured: 11.4 V</text>
<text x="75" y="425" class="s">Label: 2450 mAh / 30C</text>
<text x="75" y="462" class="t">Main +</text><text x="75" y="499" class="t">Main −</text>
<rect x="640" y="310" width="470" height="210" rx="12" class="box"/>
<text x="665" y="352" class="h">HW-140 REGULATOR</text>
<text x="665" y="390" class="t">CV: set output to 5.0 V</text>
<text x="665" y="425" class="s">CC: current limit, not speed control</text>
<text x="665" y="462" class="t">IN+</text><text x="1000" y="462" class="t">OUT+</text>
<text x="665" y="499" class="t">IN−</text><text x="1000" y="499" class="t">OUT−</text>
<path d="M400 455H640" class="pwr"/><path d="M400 492H640" class="gnd"/>
<rect x="1390" y="310" width="360" height="210" rx="12" class="box"/>
<text x="1415" y="352" class="h">BLUE GATE SERVO</text>
<text x="1415" y="390" class="t">Open 90° / close 0°</text>
<text x="1415" y="425" class="s">Verify mechanical clearance</text>
<text x="1415" y="462" class="t">Red: +5 V</text>
<text x="1415" y="499" class="t">Brown/black: GND</text>
<path d="M1110 455H1390" class="pwr"/><path d="M1110 492H1390" class="gnd"/>
<text x="75" y="565" class="t">Servo orange/yellow signal → UNO D9. USB powers the UNO; servo power comes from the regulator.</text>
<text x="75" y="605" class="t">Set and meter-check OUT+/OUT− at 5.0 V with servo disconnected. Power off before attaching wires.</text>
<rect x="50" y="630" width="1700" height="100" rx="12" fill="#e2eaf2"/>
<text x="75" y="670" class="h">COMMON GROUND</text>
<text x="75" y="708" class="t">Battery − / HW-140 IN− + HW-140 OUT− + servo ground + UNO GND + L298N GND + sensor grounds.</text>

<text x="50" y="790" class="h">2 / MOTORS: ARDUINO SIGNALS → L298N → TWO YELLOW WHEEL MOTORS</text>
<rect x="50" y="820" width="1700" height="365" rx="12" class="box"/>
<text x="80" y="865" class="h">ARDUINO UNO</text><text x="690" y="865" class="h">L298N DRIVER</text><text x="1250" y="865" class="h">MOTOR CONNECTIONS</text>
<g class="t">
<text x="80" y="910">D5 / left speed PWM</text><text x="690" y="910">ENA</text>
<text x="80" y="950">D2 / left direction</text><text x="690" y="950">IN1</text>
<text x="80" y="990">D4 / left direction</text><text x="690" y="990">IN2</text>
<text x="80" y="1030">D6 / right speed PWM</text><text x="690" y="1030">ENB</text>
<text x="80" y="1070">D7 / right direction</text><text x="690" y="1070">IN3</text>
<text x="80" y="1110">D8 / right direction</text><text x="690" y="1110">IN4</text>
<text x="1250" y="925">OUT1 + OUT2 → left motor</text>
<text x="1250" y="975">OUT3 + OUT4 → right motor</text>
<text x="1250" y="1035">Neither motor wire goes</text><text x="1250" y="1070">directly to UNO or GND.</text>
</g>
<path d="M410 902H650 M410 942H650 M410 982H650 M410 1022H650 M410 1062H650 M410 1102H650" class="sig"/>
<text x="80" y="1155" class="s">Steering: different left/right PWM values curve the robot. Opposite directions rotate it in place.</text>
<rect x="50" y="1205" width="1700" height="175" rx="12" fill="#fff0cc"/>
<text x="75" y="1245" class="h">L298N POWER / JUMPERS</text>
<text x="75" y="1285" class="t">Remove ENA and ENB caps for PWM control. Remove 5V-EN for this USB-powered logic arrangement.</text>
<text x="75" y="1325" class="t">UNO 5V → L298N 5V logic input. UNO GND → L298N GND. Do not join regulator OUT+ to UNO 5V.</text>
<text x="75" y="1360" class="s">Verified motor supply + → VM / +12V terminal; supply − → common GND. The +12V label does not set motor voltage.</text>

<text x="50" y="1435" class="h">3 / OPTIONAL SENSORS: USB-POWERED 5 V + COMMON GND</text>
<rect x="50" y="1460" width="1700" height="180" rx="12" class="box"/>
<text x="75" y="1502" class="t">Left ultrasonic: TRIG → A0, ECHO → A1. Right ultrasonic: TRIG → A2, ECHO → A3.</text>
<text x="75" y="1542" class="t">IR line sensor OUT → A4. Confirmed on your field: white = 1, background = 0.</text>
<text x="75" y="1582" class="t">Color sensor: S0 → D10, S1 → D11, S2 → D12, S3 → D13, OUT → A5; LED pin left unconnected.</text>
<text x="75" y="1620" class="s">Sensor readings require the appropriate sketch. gate_test disables motors; it does not read sensors.</text>
<text x="50" y="1685" class="s">Red = positive power | Dark = ground | Blue = control signals. Use proper power wiring, not breadboard rails, for motors/servo.</text>
<text x="50" y="1723" class="s">Regulator powers the servo only in this diagram. Disconnect the old servo supply. Battery → motor-driver connection remains pending.</text>
</svg>
